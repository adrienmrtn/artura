name: Google Play store

# Met à jour l'appli Android dans la Play Console, sans les captures d'écran :
#  1. la fiche du Store dans toutes les langues (nom, description courte, description complète,
#     e-mail de contact), reprise des textes App Store de fastlane/metadata (android/play/play_listing.py) ;
#  2. les 3 abonnements Artura Pro avec leurs essais gratuits, leurs prix par pays et leurs textes
#     (android/play/play_subscriptions.py).
#  3. avec « [play:shots] » dans le message de commit : les captures d'écran Android de chaque langue,
#     l'image de présentation et l'icône (screenshots/render_android.py, puis android/play/play_images.py).
# Lancement : onglet Actions > « Google Play store » > Run workflow (une fois ce fichier sur la branche
# principale), ou un push sur une branche claude/** dont le message de commit contient
# « [play:dry] » (simulation) ou « [play] » (pour de vrai).
# Secret : PLAY_SERVICE_ACCOUNT_JSON. Prérequis : une première version envoyée en test interne.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation seulement (n'écrit rien)"
        type: boolean
        default: true
  push:
    branches: ["claude/**"]

jobs:
  play:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[play') && !contains(github.event.head_commit.message, '[play:shots]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      DRY: ${{ (inputs.dry_run || contains(github.event.head_commit.message, '[play:dry]')) && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - name: Contrôle des fichiers
        run: |
          python3 android/play/play_listing.py --check
          python3 android/play/play_subscriptions.py --check
      - name: Accès à Google Play
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON manquant"; exit 1; fi
          python3 - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          info = json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"])
          print("Compte de service :", info.get("client_email"))
          s = AuthorizedSession(service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/androidpublisher"]))
          r = s.post("https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.vikstudios.artura/edits")
          print("Ouverture d'une modification :", r.status_code, r.text[:500])
          if r.ok:
              s.delete(f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.vikstudios.artura/edits/{r.json()['id']}")
          else:
              raise SystemExit(1)
          PY
      - name: Relecture de la fiche actuelle
        if: contains(github.event.head_commit.message, '[play:check]')
        run: python3 android/play/play_listing.py --verify
      - name: Fiche du Store (toutes les langues)
        if: "!contains(github.event.head_commit.message, '[play:check]')"
        id: listing
        continue-on-error: true
        run: python3 android/play/play_listing.py $DRY
      - name: Abonnements
        if: "!contains(github.event.head_commit.message, '[play:check]')"
        run: python3 android/play/play_subscriptions.py $DRY
      - name: Résultat de la fiche du Store
        if: steps.listing.outcome == 'failure'
        run: echo "::error::La fiche du Store n'a pas pu être envoyée (voir l'étape plus haut)"; exit 1

  images:
    if: contains(github.event.head_commit.message, '[play:shots]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Outils de rendu
        run: |
          pip install google-auth requests playwright
          python3 -m playwright install --with-deps chromium
          cd screenshots && npm install --no-audit --no-fund
      - name: Captures Android (toutes les langues)
        run: python3 screenshots/render_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: play-store-images
          path: screenshots/out-android
      - name: Envoi vers Google Play
        run: python3 android/play/play_images.py screenshots/out-android
