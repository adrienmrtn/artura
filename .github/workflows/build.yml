name: Build iOS

# Compile l'appli pour le simulateur à chaque push sur une branche de travail.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Version de Xcode
        run: xcodebuild -version
      - name: Compilation (simulateur iPhone)
        run: |
          set -o pipefail
          xcodebuild -project Artura.xcodeproj -scheme Artura -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -n 40
      - name: Erreurs de compilation
        if: failure()
        run: |
          grep -E "(error|warning: unused|fatal error):" build.log | sort -u | head -n 200 || true
          # Annotations lisibles depuis l'onglet « Checks »
          grep -E "^/.*:[0-9]+:[0-9]+: error:" build.log | sort -u | head -n 50 | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1 | sed "s#$GITHUB_WORKSPACE/##")
            ln=$(echo "$line" | cut -d: -f2)
            msg=$(echo "$line" | cut -d: -f5-)
            echo "::error file=$file,line=$ln::$msg"
          done
