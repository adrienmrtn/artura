name: Build iOS

# Compile l'appli pour le simulateur à chaque push sur une branche de travail.
# Avec « [captures] » dans le message du commit, prend aussi une capture de chaque écran de l'onboarding.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Version de Xcode
        run: xcodebuild -version
      - name: Compilation (simulateur iPhone)
        run: |
          set -o pipefail
          xcodebuild -project Artura.xcodeproj -scheme Artura -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -n 30
      - name: Erreurs et avertissements
        if: always()
        run: |
          echo "@@ERRORS"
          grep -E "^/.*: (error|warning):" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -n 200 || true
          grep -E "^(error|ld|clang): " build.log | sort -u | head -n 40 || true
          echo "@@ERRORS_END"
      - name: Captures d'écran de l'onboarding
        if: contains(github.event.head_commit.message, '[captures]')
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "Artura.app" | head -n 1)
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 16 \(" | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulateur : $DEVICE · appli : $APP"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b >/dev/null
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p shots
          BUNDLE=com.vikstudios.artura
          # shoot <fichier> <étape> <attente en secondes> [arguments supplémentaires]
          shoot() {
            local name=$1 step=$2 wait=$3; shift 3
            xcrun simctl launch "$DEVICE" $BUNDLE -onbStep "$step" -onbName Max -onbPreviewOffer YES "$@" >/dev/null
            sleep "$wait"
            xcrun simctl io "$DEVICE" screenshot "shots/$name.png" >/dev/null 2>&1
            xcrun simctl terminate "$DEVICE" $BUNDLE >/dev/null 2>&1 || true
          }
          shoot 00_splash welcome 6 -holdSplash YES
          shoot 01_welcome welcome 12 -noSplash YES
          shoot 02_daily daily 5 -noSplash YES
          shoot 03_pocketMuseum pocketMuseum 5 -noSplash YES
          shoot 04_photo photo 5 -noSplash YES
          shoot 05_quotes quotes 6 -noSplash YES
          shoot 06_questionsIntro questionsIntro 5 -noSplash YES
          shoot 07_name name 5 -noSplash YES
          shoot 08_gender gender 5 -noSplash YES
          shoot 09_motivation motivation 5 -noSplash YES
          shoot 10_arts arts 5 -noSplash YES
          shoot 11_recognize recognize 5 -noSplash YES
          shoot 12_knowledge knowledge 5 -noSplash YES
          shoot 13_museum museum 5 -noSplash YES
          shoot 14_testIntro testIntro 5 -noSplash YES
          shoot 15_flashTest flashTest 5 -noSplash YES
          shoot 16_flashResult flashResult 7 -noSplash YES
          shoot 17_understand understand 10 -noSplash YES
          shoot 18_lesson lesson 5 -noSplash YES
          shoot 19_phoneTime phoneTime 5 -noSplash YES
          shoot 20_phoneResult phoneResult 8 -noSplash YES
          shoot 21_projection projection 7 -noSplash YES
          shoot 22_graph graph 8 -noSplash YES
          shoot 23_streak streak 6 -noSplash YES
          shoot 24_reminder reminder 5 -noSplash YES
          shoot 25_loading loading 11 -noSplash YES
          shoot 26_plan plan 5 -noSplash YES
          shoot 27_account account 5 -noSplash YES
          shoot 28_gift gift 5 -noSplash YES
          shoot 29_giftOpen gift 5 -noSplash YES -onbGiftOpen YES
          shoot 30_noCommitment noCommitment 7 -noSplash YES
          shoot 31_trial trial 12 -noSplash YES
          shoot 32_exitOffer trial 6 -noSplash YES -onbExitOffer YES
          xcrun simctl launch "$DEVICE" $BUNDLE -skipOnboarding YES -noSplash YES >/dev/null; sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/33_today.png >/dev/null 2>&1
          xcrun simctl terminate "$DEVICE" $BUNDLE >/dev/null 2>&1 || true
          for f in shots/*.png; do
            sips -s format jpeg -s formatOptions 55 -Z 800 "$f" --out "${f%.png}.jpg" >/dev/null 2>&1
          done
          for f in shots/*.jpg; do
            echo "@@SHOT $(basename "$f")"
            base64 -i "$f" | fold -w 160
            echo "@@END"
          done
