# Solution de secours : si Artura.xcodeproj ne s'ouvre pas, lancer `xcodegen` à la racine
# (brew install xcodegen) pour régénérer le projet à partir de ce fichier.
name: Artura
options:
  bundleIdPrefix: com.vikstudios
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
targets:
  Artura:
    type: application
    platform: iOS
    sources:
      - path: Artura
        excludes:
          - "Fonts/LICENSE"
          - "Fonts/LICENSE_FONT"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vikstudios.artura
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "25"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Artura
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Artura/Artura.entitlements
    dependencies:
      - target: ArturaWidget
  ArturaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ArturaWidget
      - path: Artura/Widget/DailyArtwork.swift
      - path: Artura/Widget/DailyArtworkWidgetView.swift
      - path: Artura/Resources/content.json
      - path: Artura/Core/Localization.swift
      - path: Artura/Resources/content.ar.json
      - path: Artura/Resources/content.bg.json
      - path: Artura/Resources/content.cs.json
      - path: Artura/Resources/content.da.json
      - path: Artura/Resources/content.de.json
      - path: Artura/Resources/content.el.json
      - path: Artura/Resources/content.es.json
      - path: Artura/Resources/content.et.json
      - path: Artura/Resources/content.fi.json
      - path: Artura/Resources/content.fr.json
      - path: Artura/Resources/content.he.json
      - path: Artura/Resources/content.hr.json
      - path: Artura/Resources/content.hu.json
      - path: Artura/Resources/content.it.json
      - path: Artura/Resources/content.ja.json
      - path: Artura/Resources/content.lt.json
      - path: Artura/Resources/content.lv.json
      - path: Artura/Resources/content.nb.json
      - path: Artura/Resources/content.nl.json
      - path: Artura/Resources/content.pl.json
      - path: Artura/Resources/content.pt-BR.json
      - path: Artura/Resources/content.pt-PT.json
      - path: Artura/Resources/content.ro.json
      - path: Artura/Resources/content.ru.json
      - path: Artura/Resources/content.sk.json
      - path: Artura/Resources/content.sl.json
      - path: Artura/Resources/content.sr-Latn.json
      - path: Artura/Resources/content.sv.json
      - path: Artura/Resources/content.tr.json
      - path: Artura/Fonts/Figtree_400Regular.ttf
      - path: Artura/Fonts/Figtree_600SemiBold.ttf
      - path: Artura/Fonts/Figtree_700Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vikstudios.artura.widget
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "25"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ArturaWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Artura
        SKIP_INSTALL: YES
schemes:
  Artura:
    build:
      targets:
        Artura: all
    run:
      config: Debug
      storeKitConfiguration: Artura/Artura.storekit
