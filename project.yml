# Solution de secours : si Artura.xcodeproj ne s'ouvre pas, lancer `xcodegen` à la racine
# (brew install xcodegen) pour régénérer le projet à partir de ce fichier.
name: Artura
options:
  bundleIdPrefix: com.vikstudios
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
targets:
  Artura:
    type: application
    platform: iOS
    sources:
      - path: Artura
        excludes:
          - "Fonts/LICENSE"
          - "Fonts/LICENSE_FONT"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vikstudios.artura
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "23"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Artura
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Artura/Artura.entitlements
schemes:
  Artura:
    build:
      targets:
        Artura: all
    run:
      config: Debug
      storeKitConfiguration: Artura/Artura.storekit
